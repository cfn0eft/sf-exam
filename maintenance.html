<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0176d3">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<title>ただいま一時的に非公開です</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  display:flex;align-items:center;justify-content:center;min-height:100vh;
  background:#f8fafc;color:#0f172a;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;
  -webkit-font-smoothing:antialiased;padding:24px;
}
@media (prefers-color-scheme: dark){
  body{background:#0f172a;color:#f1f5f9}
  .card{background:#1e293b;border-color:#334155}
  .sub{color:#94a3b8}
}
.card{
  max-width:480px;width:100%;background:#fff;border:1px solid #e2e8f0;border-radius:16px;
  padding:40px 32px;text-align:center;
  box-shadow:0 10px 25px -5px rgba(15,23,42,.12),0 4px 10px -2px rgba(15,23,42,.08);
}
.icon{font-size:48px;line-height:1;margin-bottom:16px}
h1{margin:0 0 12px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.sub{margin:0;color:#475569;font-size:15px;line-height:1.7}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🛠️</div>
    <h1>ただいま一時的に非公開です</h1>
    <p class="sub">
      メンテナンスのため、サイトの公開を一時的に停止しています。<br>
      ご不便をおかけしますが、再開までしばらくお待ちください。
    </p>
  </div>
</body>
</html>
