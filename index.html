<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SF資格 学習アプリ</title>
  <script>
    // ルートURLにアクセスされたら、端末に応じて自動転送する
    // （スマホ → モバイル版 / PC → quiz.html）。どちらも内容は同じです。
    (function () {
      try {
        var isMobile = /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent)
          || (window.matchMedia && window.matchMedia('(max-width: 768px)').matches);
        location.replace(isMobile ? 'mobile/index.html' : 'quiz.html');
      } catch (e) {
        location.replace('quiz.html');
      }
    })();
  </script>
</head>
<body>
  <p style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;text-align:center;margin-top:48px;color:#475569">
    読み込み中…<br>
    自動で移動しない場合は
    <a href="quiz.html">PC版を開く</a> ／ <a href="mobile/index.html">モバイル版を開く</a>
  </p>
</body>
</html>
