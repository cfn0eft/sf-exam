<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script src="maintenance.js?v=106"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="description" content="Salesforce 認定資格（アドミニストレーター・Platform アプリビルダー・デベロッパー）の無料学習クイズ。本番形式の模試・分野別の弱点分析・間違いノート・用語帳・SRS復習で合格まで伴走します。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0176d3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>資格学習アプリ — ホーム</title>
<style>
:root{
  --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --text-sub:#475569;
  --border:#e2e8f0; --accent:#2563eb; --accent-hover:#1d4ed8;
  --muted:#f1f5f9; --muted-text:#94a3b8;
  --shadow:0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
  --shadow-hover:0 10px 25px -5px rgba(15,23,42,.12), 0 4px 10px -2px rgba(15,23,42,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --text-sub:#94a3b8;
    --border:#334155; --accent:#3b82f6; --accent-hover:#60a5fa;
    --muted:#1e293b; --muted-text:#64748b;
    --shadow:0 1px 3px rgba(0,0,0,.3);
    --shadow-hover:0 10px 25px -5px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.container{max-width:1080px;margin:0 auto;padding:32px 20px 64px}
.hero{text-align:center;padding:24px 0 40px}
.hero h1{margin:0 0 8px;font-size:32px;font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;color:var(--text-sub);font-size:15px}
.sec-label{font-size:12px;font-weight:700;color:var(--text-sub);
  text-transform:uppercase;letter-spacing:.08em;margin:8px 0 16px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{display:flex;flex-direction:column;background:var(--card);
  border:1px solid var(--border);border-radius:14px;padding:22px 20px;
  text-decoration:none;color:inherit;box-shadow:var(--shadow);
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  min-height:200px;position:relative;overflow:hidden}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--accent)}
.card.coming{background:var(--muted);cursor:default;color:var(--muted-text)}
.card.coming:hover{transform:none;box-shadow:var(--shadow);border-color:var(--border)}
.card-icon{font-size:32px;margin-bottom:12px;line-height:1}
.card-title{font-size:17px;font-weight:700;margin:0 0 6px;line-height:1.35}
.card-desc{font-size:13px;color:var(--text-sub);line-height:1.55;margin:0 0 14px;flex:1}
.card.coming .card-desc{color:var(--muted-text)}
.card-meta{display:flex;gap:14px;font-size:12px;color:var(--text-sub);font-weight:600;flex-wrap:wrap}
.card-meta span::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;
  background:var(--accent);margin-right:6px;vertical-align:middle}
.coming-badge{position:absolute;top:14px;right:14px;background:var(--muted-text);
  color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;
  text-transform:uppercase;letter-spacing:.04em}
.cram-pill{position:absolute;top:12px;right:12px;background:var(--accent);color:#fff;
  font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;cursor:pointer;z-index:3}
.cram-pill:hover{background:var(--accent-hover)}
.acq-badge{position:absolute;top:12px;right:12px;background:linear-gradient(135deg,#ffd86b,#f0a500);
  color:#5a3d00;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;
  box-shadow:0 2px 8px rgba(240,165,0,.4);z-index:3}
.card.acq{border-color:#f5c451;box-shadow:0 0 0 1px #f5c451, var(--shadow)}
.footer{text-align:center;color:var(--text-sub);font-size:12px;margin-top:48px}
.footer a{color:var(--accent);text-decoration:none}
.footer a:hover{text-decoration:underline}
@media (max-width:480px){
  .container{padding:20px 16px 48px}
  .hero{padding:12px 0 28px}
  .hero h1{font-size:24px}
  .hero p{font-size:13px}
  .grid{grid-template-columns:1fr;gap:12px}
  .card{min-height:0;padding:18px 16px}
}
/* アップデートのお知らせ（バナー＋モーダル） */
.lp-news{display:flex;align-items:center;gap:13px;width:100%;cursor:pointer;text-align:left;font:inherit;
  background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px 18px;margin:0 0 26px;
  color:inherit;box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.lp-news:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:var(--accent)}
.lp-news.unseen{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.lp-news-ic{font-size:24px;flex-shrink:0}
.lp-news-main{display:flex;flex-direction:column;flex:1;min-width:0}
.lp-news-t{font-size:15px;font-weight:700;line-height:1.3}
.lp-news-sub{font-size:12px;color:var(--text-sub);margin-top:3px}
.lp-news-new{flex-shrink:0;font-size:10px;font-weight:800;letter-spacing:.04em;color:#fff;background:#ef4444;border-radius:999px;padding:3px 9px}
.lp-news-arrow{font-size:22px;color:var(--text-sub);flex-shrink:0}
.lp-modal{display:none;position:fixed;inset:0;z-index:1000;background:rgba(15,23,42,.55);
  align-items:center;justify-content:center;padding:20px}
.lp-modal.on{display:flex}
.lp-modal-box{width:min(94vw,480px);max-height:82vh;overflow:auto;background:var(--card);
  border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-hover)}
.lp-modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;
  border-bottom:1px solid var(--border);font-weight:800;font-size:16px}
.lp-modal-x{background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-sub);line-height:1}
.lp-modal-body{padding:6px 18px 18px}
.lp-entry{padding:15px 0;border-bottom:1px solid var(--border)}
.lp-entry:last-child{border-bottom:none}
.lp-entry-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.lp-date{font-size:11px;font-weight:700;color:#fff;background:var(--muted-text);border-radius:6px;padding:2px 8px;flex-shrink:0}
.lp-entry.latest .lp-date{background:var(--accent)}
.lp-etitle{font-size:15px;font-weight:800}
.lp-items{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px}
.lp-items li{font-size:13px;line-height:1.6;color:var(--text)}
</style>
</head>
<body>
<div class="container">

  <header class="hero">
    <h1>資格学習アプリ</h1>
    <p>学習したい資格を選択してください</p>
  </header>

  <!-- アップデートのお知らせ -->
  <button class="lp-news" id="lp-news" onclick="lpOpenNews()">
    <span class="lp-news-ic">📣</span>
    <span class="lp-news-main">
      <span class="lp-news-t" id="lp-news-t">アップデート情報</span>
      <span class="lp-news-sub" id="lp-news-sub"></span>
    </span>
    <span class="lp-news-new" id="lp-news-new" style="display:none">NEW</span>
    <span class="lp-news-arrow">›</span>
  </button>

  <div class="sec-label">利用可能な資格</div>
  <div class="grid" id="cert-grid"></div>

</div>

<!-- アップデート履歴モーダル -->
<div class="lp-modal" id="lp-modal" onclick="if(event.target===this)lpCloseNews()">
  <div class="lp-modal-box" role="dialog" aria-modal="true" aria-label="アップデート情報">
    <div class="lp-modal-head"><span>📣 アップデート情報</span><button class="lp-modal-x" onclick="lpCloseNews()" aria-label="閉じる">✕</button></div>
    <div class="lp-modal-body" id="lp-modal-body"></div>
  </div>
</div>

<!-- ============================================================
     クラウド同期：ログイン・ゲートウェイ＋アカウント管理
     このLPは進捗ストアを持たない gateway ロール。
     未ログインだとログイン画面で覆われ、資格カードを選べない。
     ログインすると右上にアカウントバッジ（ログアウト／👑管理者）が出る。
     ※ Firebase 未設定のときは締め出しを避けるため自動で同期なし通過。
     ============================================================ -->
<script>
  /* ===== 資格レジストリ：新しい資格はここに1件追加するだけ（カードを自動生成） =====
     meta は [問数, 用語数, 合格%] で統一（data/*.json と要手動同期）。
     現状: sf-admin=437問/94用語, app-builder=445問/83用語, developer=499問/75用語, agentforce=138問/26用語, sales-cloud=200問/67用語, service-cloud=120問/75用語, experience-cloud=132問/63用語, sharing-visibility=81問/54用語。 */
  const CERTS = [
    { slug:'sf-admin', storageKey:'sfq_v4', icon:'☁️', title:'Salesforce 認定<br>Platform アドミニストレーター',
      desc:'2025/12改訂の公式8分野（Agentforce 8%対応）。学習・試験・SRS・教科書・用語帳・統計をフル搭載。',
      meta:['437問','94用語','合格65%'] },
    { slug:'app-builder', storageKey:'sfqab_v1', icon:'🧩', title:'Salesforce 認定<br>Platform アプリケーションビルダー',
      desc:'宣言的なアプリ構築・データモデル・自動化・UI・リリース。公式5分野対応。',
      meta:['445問','83用語','合格63%'] },
    { slug:'developer', storageKey:'sfqdev_v1', icon:'⚡', title:'Salesforce 認定<br>Platform デベロッパー',
      desc:'Apex・SOQL/SOSL・トリガ・LWC/Aura/Visualforce・テスト/リリースを網羅。公式4分野対応。',
      meta:['499問','75用語','合格68%'] },
    { slug:'agentforce', storageKey:'sfqaf_v1', icon:'🤖', title:'Salesforce 認定<br>Agentforce Specialist',
      desc:'AIエージェント・プロンプト・Data 360・Trust Layer・テスト/ガバナンスを網羅。最新の公式6分野に対応。',
      meta:['138問','26用語','合格73%'] },
    { slug:'sales-cloud', storageKey:'sfqsales_v1', icon:'📈', title:'Salesforce 認定<br>Sales Cloud コンサルタント',
      desc:'リード・商談・売上予測・価格表・テリトリ・Sales Cloud AI を網羅。公式分野に対応し、教科書・用語帳・比較表も搭載。',
      meta:['200問','67用語','合格69%'] },
    { slug:'service-cloud', storageKey:'sfqservice_v1', icon:'🎧', title:'Salesforce 認定<br>Service Cloud コンサルタント',
      desc:'ケース管理・Omni-Channel・ナレッジ・エンタイトルメント・チャネル・分析を網羅。公式8分野に対応。',
      meta:['120問','75用語','合格67%'] },
    { slug:'experience-cloud', storageKey:'sfqexp_v1', icon:'🌐', title:'Salesforce 認定<br>Experience Cloud コンサルタント',
      desc:'サイト構築・共有・ゲストユーザー・認証/SSO・ブランド・テンプレートを網羅。公式8分野に対応。',
      meta:['132問','63用語','合格62%'] },
    { slug:'sharing-visibility', storageKey:'sfqsva_v1', icon:'🔐', title:'Salesforce 認定<br>Sharing and Visibility アーキテクト',
      desc:'権限・OWD・ロール階層・共有ルール・レコードアクセス・大規模データの可視性設計を網羅。公式4分野に対応。',
      meta:['81問','54用語','合格67%'] },
    { coming:true }
  ];
  (function renderCerts(){
    var grid = document.getElementById('cert-grid'); if (!grid) return;
    grid.innerHTML = CERTS.map(function (c) {
      if (c.coming) return '<div class="card coming"><span class="coming-badge">追加予定</span>'
        + '<div class="card-icon">🛠️</div><h2 class="card-title">資格枠（未設定）</h2>'
        + '<p class="card-desc">次に追加する資格の枠です。準備中。</p>'
        + '<div class="card-meta"><span>Coming Soon</span></div></div>';
      var meta = (c.meta || []).map(function (m) { return '<span>' + m + '</span>'; }).join('');
      var acq = '';
      try { var raw = c.storageKey && localStorage.getItem(c.storageKey); if (raw) { var s = JSON.parse(raw); if (s && s.acquiredDate) acq = '<span class="acq-badge">🎓 取得済み</span>'; } } catch (e) {}
      return '<a class="card' + (acq ? ' acq' : '') + '" href="certifications/' + c.slug + '/index.html">' + acq
        + '<div class="card-icon">' + (c.icon || '📘') + '</div>'
        + '<h2 class="card-title">' + c.title + '</h2>'
        + '<p class="card-desc">' + (c.desc || '') + '</p>'
        + '<div class="card-meta">' + meta + '</div></a>';
    }).join('');
  })();

  // cloud-sync のオーバーレイ/バッジをOSのダーク設定に追従させる
  // （LP本体の配色は @media(prefers-color-scheme) で別途対応済み）
  (function () {
    var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    function apply() { document.body.classList.toggle('dark', !!(mq && mq.matches)); }
    apply();
    if (mq && mq.addEventListener) mq.addEventListener('change', apply);
  })();
  window.SFQ_PAGE_ROLE = 'gateway';
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<!-- アップデート履歴データ（LP・全資格で共有） -->
<script src="changelog.js?v=106"></script>
<script src="cloud-sync.js?v=106"></script>
<script>
  /* ===== アップデートのお知らせ（changelog.js の window.SFQ_CHANGELOG を表示） ===== */
  function lpNewsLatest(){var c=window.SFQ_CHANGELOG||[];return c.length?c[0].id:'';}
  function lpHasUnseen(){try{return (window.SFQ_CHANGELOG||[]).length>0 && localStorage.getItem('sfq_news_seen')!==lpNewsLatest();}catch(e){return false;}}
  function lpRenderNews(){
    var c=window.SFQ_CHANGELOG||[],card=document.getElementById('lp-news');if(!card)return;
    if(!c.length){card.style.display='none';return;}
    var latest=c[0],unseen=lpHasUnseen();
    card.classList.toggle('unseen',unseen);
    document.getElementById('lp-news-t').textContent=unseen?('新着: '+latest.title):'アップデート情報';
    document.getElementById('lp-news-sub').textContent=unseen?('🆕 '+latest.date+' に更新しました'):('最新 '+latest.date+' ・ 履歴を見る');
    document.getElementById('lp-news-new').style.display=unseen?'':'none';
  }
  function lpBuildModal(){
    var c=window.SFQ_CHANGELOG||[],body=document.getElementById('lp-modal-body');if(!body)return;
    body.innerHTML=c.map(function(e,i){
      var items=(e.items||[]).map(function(it){return '<li>'+it+'</li>';}).join('');
      return '<div class="lp-entry'+(i===0?' latest':'')+'">'
        +'<div class="lp-entry-head"><span class="lp-date">'+e.date+'</span><span class="lp-etitle">'+e.title+'</span>'+(i===0?'<span class="lp-news-new">NEW</span>':'')+'</div>'
        +'<ul class="lp-items">'+items+'</ul></div>';
    }).join('');
  }
  function lpOpenNews(){lpBuildModal();var m=document.getElementById('lp-modal');if(m)m.classList.add('on');try{localStorage.setItem('sfq_news_seen',lpNewsLatest());}catch(e){}try{if(window.__cloudMarkNews)window.__cloudMarkNews(lpNewsLatest());}catch(e){}lpRenderNews();}
  window.SFQ_syncNews=lpRenderNews;
  function lpCloseNews(){var m=document.getElementById('lp-modal');if(m)m.classList.remove('on');}
  document.addEventListener('keydown',function(e){if(e.key==='Escape')lpCloseNews();});
  lpRenderNews();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>

</body>
</html>
