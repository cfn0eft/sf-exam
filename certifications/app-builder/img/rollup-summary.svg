<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" role="img" aria-label="積み上げ集計項目">
<style>
 svg{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif}
 .fig{fill:#f8fafc;stroke:#e2e8f0}
 .master{fill:#d6f5f2;stroke:#0b827c;stroke-width:1.6}
 .detail{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.4}
 .sumf{fill:#fef3e2;stroke:#dd7a01;stroke-width:1.4}
 .ink{fill:#0f172a}.sub{fill:#475569}.ttl{fill:#0f172a;font-weight:700}.ar{fill:#0b827c}
 .hm{fill:#0b827c;font-weight:700}.warn{fill:#dd7a01;font-weight:700}
 @media (prefers-color-scheme:dark){
  .fig{fill:#191919;stroke:#333}
  .master{fill:#0a2e2d;stroke:#3fbfba}.detail{fill:#262626;stroke:#555}.sumf{fill:#3b2600;stroke:#f0a830}
  .ink{fill:#f0f0f0}.sub{fill:#bbb}.ttl{fill:#f0f0f0}.ar{fill:#3fbfba}.hm{fill:#3fbfba}.warn{fill:#f0a830}
 }
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" class="ar"/></marker></defs>
<rect class="fig" x="1" y="1" width="698" height="338" rx="14"/>
<text class="ttl" x="24" y="36" font-size="19">積み上げ集計（Roll-Up Summary）</text>
<text class="sub" x="24" y="58" font-size="13">主従関係の「親」に、子レコードの合計・件数などを自動集計</text>

<rect class="master" x="210" y="80" width="280" height="76" rx="12"/>
<text class="hm" x="232" y="106" font-size="14">親：商談（Master）</text>
<rect class="sumf" x="232" y="116" width="236" height="28" rx="7"/>
<text class="ink" x="244" y="135" font-size="12">合計金額 ＝ SUM(子の金額)　… 自動</text>

<rect class="detail" x="70" y="232" width="160" height="60" rx="10"/>
<text class="ink" x="150" y="258" font-size="12" text-anchor="middle">商談商品①</text>
<text class="sub" x="150" y="278" font-size="12" text-anchor="middle">¥100,000</text>
<rect class="detail" x="270" y="232" width="160" height="60" rx="10"/>
<text class="ink" x="350" y="258" font-size="12" text-anchor="middle">商談商品②</text>
<text class="sub" x="350" y="278" font-size="12" text-anchor="middle">¥250,000</text>
<rect class="detail" x="470" y="232" width="160" height="60" rx="10"/>
<text class="ink" x="550" y="258" font-size="12" text-anchor="middle">商談商品③</text>
<text class="sub" x="550" y="278" font-size="12" text-anchor="middle">¥80,000</text>

<line x1="150" y1="232" x2="320" y2="160" stroke="#0b827c" stroke-width="2" marker-end="url(#a)" opacity="0.8"/>
<line x1="350" y1="232" x2="350" y2="160" stroke="#0b827c" stroke-width="2" marker-end="url(#a)" opacity="0.8"/>
<line x1="550" y1="232" x2="380" y2="160" stroke="#0b827c" stroke-width="2" marker-end="url(#a)" opacity="0.8"/>

<text class="warn" x="24" y="316" font-size="12">必須：主従関係（参照関係では不可）</text>
<text class="sub" x="676" y="316" font-size="12" text-anchor="end">集計の種類：COUNT / SUM / MIN / MAX</text>
</svg>
