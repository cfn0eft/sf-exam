<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" role="img" aria-label="オブジェクト関係の種類">
<style>
 svg{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif}
 .fig{fill:#f8fafc;stroke:#e2e8f0}
 .card{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.5}
 .a{fill:#e8f3ff;stroke:#0176d3;stroke-width:1.5}
 .b{fill:#eef2f7;stroke:#94a3b8;stroke-width:1.5}
 .m{fill:#d6f5f2;stroke:#0b827c;stroke-width:1.5}
 .j{fill:#f0ebf8;stroke:#7b5ea7;stroke-width:1.5}
 .ink{fill:#0f172a}.sub{fill:#475569}.ttl{fill:#0f172a;font-weight:700}
 .ln{stroke:#94a3b8;stroke-width:2;fill:none}.h{fill:#0176d3;font-weight:700}.hm{fill:#0b827c;font-weight:700}.hj{fill:#7b5ea7;font-weight:700}
 @media (prefers-color-scheme:dark){
  .fig{fill:#191919;stroke:#333}.card{fill:#222;stroke:#3a3a3a}
  .a{fill:#0c2d4a;stroke:#4ba3e3}.b{fill:#2b2b2b;stroke:#666}
  .m{fill:#0a2e2d;stroke:#3fbfba}.j{fill:#2a1f40;stroke:#a07fd6}
  .ink{fill:#f0f0f0}.sub{fill:#bbb}.ttl{fill:#f0f0f0}.ln{stroke:#666}
  .h{fill:#4ba3e3}.hm{fill:#3fbfba}.hj{fill:#a07fd6}
 }
</style>
<rect class="fig" x="1" y="1" width="698" height="378" rx="14"/>
<text class="ttl" x="24" y="36" font-size="19">オブジェクト関係の種類</text>

<rect class="card" x="22" y="54" width="210" height="302" rx="12"/>
<text class="h" x="40" y="82" font-size="14">参照（Lookup）</text>
<rect class="a" x="46" y="100" width="74" height="40" rx="8"/><text class="ink" x="83" y="125" font-size="12" text-anchor="middle">A</text>
<rect class="b" x="134" y="100" width="74" height="40" rx="8"/><text class="ink" x="171" y="125" font-size="12" text-anchor="middle">B</text>
<line class="ln" x1="120" y1="120" x2="134" y2="120"/><circle cx="127" cy="120" r="5" class="ln" fill="none"/>
<text class="ink" x="40" y="176" font-size="12">・ ゆるい関連</text>
<text class="ink" x="40" y="198" font-size="12">・ 任意でも可</text>
<text class="ink" x="40" y="220" font-size="12">・ 独立した所有者</text>
<text class="ink" x="40" y="242" font-size="12">・ 親削除で子は残る</text>
<text class="sub" x="40" y="296" font-size="11">例：ケース →参照→ 取引先</text>

<rect class="card" x="244" y="54" width="210" height="302" rx="12"/>
<text class="hm" x="262" y="82" font-size="14">主従（Master-Detail）</text>
<rect class="m" x="268" y="100" width="74" height="40" rx="8"/><text class="ink" x="305" y="125" font-size="12" text-anchor="middle">主</text>
<rect class="m" x="356" y="100" width="74" height="40" rx="8" opacity="0.7"/><text class="ink" x="393" y="125" font-size="12" text-anchor="middle">従</text>
<line class="ln" x1="342" y1="120" x2="356" y2="120"/><path d="M345,114 l9,6 l-9,6 z" fill="#0b827c"/>
<text class="ink" x="262" y="176" font-size="12">・ 強い関連（必須）</text>
<text class="ink" x="262" y="198" font-size="12">・ 親削除で子も削除</text>
<text class="ink" x="262" y="220" font-size="12">・ 共有/所有は親に従う</text>
<text class="ink" x="262" y="242" font-size="12">・ 積み上げ集計が可能</text>
<text class="sub" x="262" y="296" font-size="11">例：商談 →主従→ 商談商品</text>

<rect class="card" x="466" y="54" width="212" height="302" rx="12"/>
<text class="hj" x="484" y="82" font-size="14">多対多（Junction）</text>
<rect class="a" x="484" y="100" width="60" height="38" rx="8"/><text class="ink" x="514" y="124" font-size="12" text-anchor="middle">A</text>
<rect class="j" x="566" y="150" width="80" height="38" rx="8"/><text class="ink" x="606" y="174" font-size="11" text-anchor="middle">中間</text>
<rect class="a" x="484" y="200" width="60" height="38" rx="8"/><text class="ink" x="514" y="224" font-size="12" text-anchor="middle">B</text>
<line class="ln" x1="544" y1="119" x2="566" y2="160"/><path d="M556,150 l11,3 l-7,9 z" fill="#0b827c"/>
<line class="ln" x1="544" y1="219" x2="566" y2="178"/><path d="M556,188 l11,-3 l-7,-9 z" fill="#0b827c"/>
<text class="ink" x="484" y="270" font-size="12">・ 中間オブジェクトを</text>
<text class="ink" x="484" y="288" font-size="12">　作り、A・Bへ主従2本</text>
<text class="sub" x="484" y="320" font-size="11">例：講座 ⇔ 受講生</text>
</svg>
