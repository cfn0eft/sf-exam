<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" role="img" aria-label="Lightningアプリケーションビルダーのページ構成">
<style>
 svg{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif}
 .fig{fill:#f8fafc;stroke:#e2e8f0}
 .page{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
 .hdr{fill:#e8f3ff;stroke:#0176d3;stroke-width:1.5}
 .comp{fill:#eef6ff;stroke:#7aa9d6;stroke-width:1.3}
 .side{fill:#d6f5f2;stroke:#0b827c;stroke-width:1.3}
 .pal{fill:#f0ebf8;stroke:#7b5ea7;stroke-width:1.5}
 .ink{fill:#0f172a}.sub{fill:#475569}.ttl{fill:#0f172a;font-weight:700}.wt{fill:#0176d3}
 @media (prefers-color-scheme:dark){
  .fig{fill:#191919;stroke:#333}.page{fill:#232323;stroke:#444}
  .hdr{fill:#0c2d4a;stroke:#4ba3e3}.comp{fill:#12263b;stroke:#3a6c9c}
  .side{fill:#0a2e2d;stroke:#3fbfba}.pal{fill:#2a1f40;stroke:#a07fd6}
  .ink{fill:#f0f0f0}.sub{fill:#bbb}.ttl{fill:#f0f0f0}.wt{fill:#4ba3e3}
 }
</style>
<rect class="fig" x="1" y="1" width="698" height="378" rx="14"/>
<text class="ttl" x="24" y="36" font-size="19">Lightning アプリケーションビルダー</text>
<text class="sub" x="24" y="58" font-size="13">テンプレートの「リージョン」に、コンポーネントをドラッグして配置する</text>

<rect class="pal" x="24" y="78" width="150" height="270" rx="11"/>
<text class="ink" x="99" y="104" font-size="13" font-weight="700" text-anchor="middle">コンポーネント</text>
<rect class="comp" x="40" y="120" width="118" height="30" rx="7"/><text class="ink" x="99" y="140" font-size="11" text-anchor="middle">レコード詳細</text>
<rect class="comp" x="40" y="158" width="118" height="30" rx="7"/><text class="ink" x="99" y="178" font-size="11" text-anchor="middle">関連リスト</text>
<rect class="comp" x="40" y="196" width="118" height="30" rx="7"/><text class="ink" x="99" y="216" font-size="11" text-anchor="middle">活動 / ToDo</text>
<rect class="comp" x="40" y="234" width="118" height="30" rx="7"/><text class="ink" x="99" y="254" font-size="11" text-anchor="middle">レポートグラフ</text>
<rect class="comp" x="40" y="272" width="118" height="30" rx="7"/><text class="ink" x="99" y="292" font-size="11" text-anchor="middle">カスタム(LWC)</text>
<text class="sub" x="99" y="330" font-size="10.5" text-anchor="middle">標準＋カスタム</text>

<rect class="page" x="196" y="78" width="480" height="270" rx="11"/>
<rect class="hdr" x="212" y="92" width="448" height="42" rx="8"/>
<text class="wt" x="436" y="118" font-size="12.5" font-weight="700" text-anchor="middle">ヘッダー領域（強調表示の項目）</text>

<rect class="comp" x="212" y="146" width="290" height="86" rx="8"/>
<text class="ink" x="357" y="180" font-size="12.5" text-anchor="middle">メイン領域</text>
<text class="sub" x="357" y="200" font-size="11" text-anchor="middle">レコード詳細・関連リスト 等</text>

<rect class="side" x="514" y="146" width="146" height="186" rx="8"/>
<text class="ink" x="587" y="180" font-size="12" text-anchor="middle">サイドバー</text>
<text class="sub" x="587" y="200" font-size="10.5" text-anchor="middle">活動・Chatter</text>

<rect class="comp" x="212" y="244" width="290" height="88" rx="8"/>
<text class="ink" x="357" y="280" font-size="12.5" text-anchor="middle">下部領域（タブ等）</text>
<text class="sub" x="357" y="300" font-size="11" text-anchor="middle">表示条件でコンポーネントを出し分け可</text>
</svg>
