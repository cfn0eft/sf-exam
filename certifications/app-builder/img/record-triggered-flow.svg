<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" role="img" aria-label="レコードトリガーフローのタイミング">
<style>
 svg{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif}
 .fig{fill:#f8fafc;stroke:#e2e8f0}
 .before{fill:#e8f3ff;stroke:#0176d3;stroke-width:1.5}
 .db{fill:#eef2f7;stroke:#64748b;stroke-width:1.5}
 .after{fill:#d6f5f2;stroke:#0b827c;stroke-width:1.5}
 .ink{fill:#0f172a}.sub{fill:#475569}.ttl{fill:#0f172a;font-weight:700}.ar{fill:#94a3b8}
 .h1{fill:#0176d3;font-weight:700}.h2{fill:#0b827c;font-weight:700}
 @media (prefers-color-scheme:dark){
  .fig{fill:#191919;stroke:#333}
  .before{fill:#0c2d4a;stroke:#4ba3e3}.db{fill:#2b2b2b;stroke:#888}.after{fill:#0a2e2d;stroke:#3fbfba}
  .ink{fill:#f0f0f0}.sub{fill:#bbb}.ttl{fill:#f0f0f0}.ar{fill:#666}.h1{fill:#4ba3e3}.h2{fill:#3fbfba}
 }
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" class="ar"/></marker></defs>
<rect class="fig" x="1" y="1" width="698" height="338" rx="14"/>
<text class="ttl" x="24" y="36" font-size="19">レコードトリガーフローのタイミング</text>
<text class="sub" x="24" y="58" font-size="13">「保存される前」と「保存された後」で、できることが違う</text>

<text class="sub" x="40" y="100" font-size="12">ユーザーが保存</text>
<line x1="40" y1="112" x2="660" y2="112" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<text class="sub" x="660" y="100" font-size="12" text-anchor="end">完了</text>

<rect class="before" x="40" y="130" width="250" height="150" rx="12"/>
<text class="h1" x="60" y="158" font-size="15">保存前（before-save）</text>
<text class="ink" x="60" y="184" font-size="12.5">・ 同じレコードの項目を更新</text>
<text class="ink" x="60" y="206" font-size="12.5">・ 速い・追加の更新処理が不要</text>
<text class="ink" x="60" y="228" font-size="12.5">・ レコードIDはまだ無い場合あり</text>
<text class="sub" x="60" y="262" font-size="11.5">用途：入力値の補正・初期化</text>

<rect class="db" x="312" y="170" width="76" height="70" rx="11"/>
<text class="ink" x="350" y="200" font-size="12" text-anchor="middle">DBに</text>
<text class="ink" x="350" y="218" font-size="12" text-anchor="middle">保存</text>

<rect class="after" x="410" y="130" width="250" height="150" rx="12"/>
<text class="h2" x="430" y="158" font-size="15">保存後（after-save）</text>
<text class="ink" x="430" y="184" font-size="12.5">・ 関連レコードを作成/更新</text>
<text class="ink" x="430" y="206" font-size="12.5">・ メール送信・他オブジェクト操作</text>
<text class="ink" x="430" y="228" font-size="12.5">・ レコードIDが使える</text>
<text class="sub" x="430" y="262" font-size="11.5">用途：連動作成・通知・外部連携</text>

<line x1="290" y1="205" x2="312" y2="205" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<line x1="388" y1="205" x2="410" y2="205" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
</svg>
