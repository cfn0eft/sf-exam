<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" role="img" aria-label="リード変換">
<style>
 svg{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif}
 .fig{fill:#f8fafc;stroke:#e2e8f0}
 .lead{fill:#fef3e2;stroke:#dd7a01;stroke-width:1.5}
 .acc{fill:#e8f3ff;stroke:#0176d3;stroke-width:1.5}
 .con{fill:#d6f5f2;stroke:#0b827c;stroke-width:1.5}
 .opp{fill:#f0ebf8;stroke:#7b5ea7;stroke-width:1.5}
 .ink{fill:#0f172a}.sub{fill:#475569}.ttl{fill:#0f172a;font-weight:700}.ar{fill:#94a3b8}
 .conv{fill:#2e844a;font-weight:700}
 @media (prefers-color-scheme:dark){
  .fig{fill:#191919;stroke:#333}
  .lead{fill:#3b2600;stroke:#f0a830}.acc{fill:#0c2d4a;stroke:#4ba3e3}
  .con{fill:#0a2e2d;stroke:#3fbfba}.opp{fill:#2a1f40;stroke:#a07fd6}
  .ink{fill:#f0f0f0}.sub{fill:#bbb}.ttl{fill:#f0f0f0}.ar{fill:#666}.conv{fill:#3ba755}
 }
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" class="ar"/></marker></defs>
<rect class="fig" x="1" y="1" width="698" height="318" rx="14"/>
<text class="ttl" x="24" y="38" font-size="19">リード変換（Lead Conversion）</text>
<text class="sub" x="24" y="60" font-size="13">見込み（リード）を、取引につながる3つのレコードに変換する</text>

<rect class="lead" x="40" y="110" width="150" height="90" rx="12"/>
<text class="ink" x="115" y="148" font-size="15" font-weight="700" text-anchor="middle">リード</text>
<text class="sub" x="115" y="170" font-size="11.5" text-anchor="middle">未分類の見込み客</text>
<text class="sub" x="115" y="187" font-size="11.5" text-anchor="middle">（個人＋会社が混在）</text>

<line x1="196" y1="155" x2="270" y2="155" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
<text class="conv" x="233" y="146" font-size="12" text-anchor="middle">変換</text>

<rect class="acc" x="288" y="74" width="170" height="56" rx="11"/>
<text class="ink" x="373" y="98" font-size="13.5" font-weight="700" text-anchor="middle">取引先（Account）</text>
<text class="sub" x="373" y="117" font-size="11" text-anchor="middle">会社</text>

<rect class="con" x="288" y="142" width="170" height="56" rx="11"/>
<text class="ink" x="373" y="166" font-size="13.5" font-weight="700" text-anchor="middle">取引先責任者（Contact）</text>
<text class="sub" x="373" y="185" font-size="11" text-anchor="middle">人</text>

<rect class="opp" x="288" y="210" width="170" height="56" rx="11"/>
<text class="ink" x="373" y="234" font-size="13.5" font-weight="700" text-anchor="middle">商談（Opportunity）</text>
<text class="sub" x="373" y="253" font-size="11" text-anchor="middle">案件 ※任意（作らなくても可）</text>

<line x1="270" y1="120" x2="284" y2="102" class="ar" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<line x1="270" y1="155" x2="284" y2="168" class="ar" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
<line x1="270" y1="190" x2="284" y2="234" class="ar" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

<text class="sub" x="492" y="120" font-size="12">・ 変換は1方向（元に戻せない）</text>
<text class="sub" x="492" y="148" font-size="12">・ 既存の取引先/責任者に</text>
<text class="sub" x="492" y="166" font-size="12">　マージもできる</text>
<text class="sub" x="492" y="194" font-size="12">・ 重複の自動マージはされない</text>
<text class="sub" x="492" y="222" font-size="12">・ 変換時に必要項目を</text>
<text class="sub" x="492" y="240" font-size="12">　マッピングしておく</text>
</svg>
