<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img" aria-label="レコードアクセスの決まり方">
<style>
 svg{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif}
 .fig{fill:#f8fafc;stroke:#e2e8f0}
 .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
 .b1{fill:#e8f3ff;stroke:#0176d3;stroke-width:1.5}
 .b2{fill:#e3eefe;stroke:#3b66d3;stroke-width:1.5}
 .b3{fill:#d6f5f2;stroke:#0b827c;stroke-width:1.5}
 .b4{fill:#fef3e2;stroke:#dd7a01;stroke-width:1.5}
 .ink{fill:#0f172a}.sub{fill:#475569}.ttl{fill:#0f172a;font-weight:700}
 .ar{fill:#94a3b8}.cap{fill:#64748b}
 .grad-a{stop-color:#0176d3}.grad-b{stop-color:#dd7a01}
 @media (prefers-color-scheme:dark){
  .fig{fill:#191919;stroke:#333}.box{fill:#262626;stroke:#444}
  .b1{fill:#0c2d4a;stroke:#4ba3e3}.b2{fill:#142a4a;stroke:#5b86d3}
  .b3{fill:#0a2e2d;stroke:#3fbfba}.b4{fill:#3b2600;stroke:#f0a830}
  .ink{fill:#f0f0f0}.sub{fill:#bbb}.ttl{fill:#f0f0f0}.ar{fill:#666}.cap{fill:#999}
 }
</style>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" class="ar"/></marker>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" class="grad-a"/><stop offset="1" class="grad-b"/></linearGradient></defs>
<rect class="fig" x="1" y="1" width="698" height="358" rx="14"/>
<text class="ttl" x="24" y="36" font-size="19">レコードへのアクセスはどう決まる？</text>
<text class="sub" x="24" y="58" font-size="13">下の段階を足し合わせてアクセスが「広がっていく」（OWD が土台）</text>

<rect class="b1" x="24" y="84" width="148" height="92" rx="11"/>
<text class="ink" x="98" y="116" font-size="14" font-weight="700" text-anchor="middle">①組織の共有設定</text>
<text class="ink" x="98" y="135" font-size="12" text-anchor="middle">(OWD)</text>
<text class="sub" x="98" y="158" font-size="11" text-anchor="middle">既定の公開範囲</text>

<rect class="b2" x="204" y="84" width="148" height="92" rx="11"/>
<text class="ink" x="278" y="116" font-size="14" font-weight="700" text-anchor="middle">②ロール階層</text>
<text class="sub" x="278" y="140" font-size="11" text-anchor="middle">上位は下位の</text>
<text class="sub" x="278" y="156" font-size="11" text-anchor="middle">レコードを閲覧</text>

<rect class="b3" x="384" y="84" width="148" height="92" rx="11"/>
<text class="ink" x="458" y="116" font-size="14" font-weight="700" text-anchor="middle">③共有ルール</text>
<text class="sub" x="458" y="140" font-size="11" text-anchor="middle">条件/所有者で</text>
<text class="sub" x="458" y="156" font-size="11" text-anchor="middle">追加開放</text>

<rect class="b4" x="564" y="84" width="112" height="92" rx="11"/>
<text class="ink" x="620" y="116" font-size="14" font-weight="700" text-anchor="middle">④手動共有</text>
<text class="sub" x="620" y="140" font-size="11" text-anchor="middle">個別に1件ずつ</text>
<text class="sub" x="620" y="156" font-size="11" text-anchor="middle">／チーム共有</text>

<line x1="174" y1="130" x2="200" y2="130" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="354" y1="130" x2="380" y2="130" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="534" y1="130" x2="560" y2="130" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>

<rect x="24" y="206" width="652" height="14" rx="7" fill="url(#g)" opacity="0.85"/>
<text class="cap" x="24" y="244" font-size="12">狭い（非公開）</text>
<text class="cap" x="676" y="244" font-size="12" text-anchor="end">広い（公開）</text>
<text class="sub" x="350" y="298" font-size="12.5" text-anchor="middle">ポイント：OWD を「非公開」にし、必要な人にだけ②〜④で開けるのが基本パターン。</text>
<text class="sub" x="350" y="320" font-size="12.5" text-anchor="middle">アクセスは「奪う」のではなく上の段階で「足していく」イメージ。</text>
</svg>
