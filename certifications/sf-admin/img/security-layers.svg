<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img" aria-label="アクセスの3つの層">
<style>
 svg{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif}
 .fig{fill:#f8fafc;stroke:#e2e8f0}
 .b1{fill:#e8f3ff;stroke:#0176d3;stroke-width:1.5}
 .b2{fill:#d6f5f2;stroke:#0b827c;stroke-width:1.5}
 .b3{fill:#f0ebf8;stroke:#7b5ea7;stroke-width:1.5}
 .ink{fill:#0f172a}.sub{fill:#475569}.ttl{fill:#0f172a;font-weight:700}.tag{fill:#0f172a}
 @media (prefers-color-scheme:dark){
  .fig{fill:#191919;stroke:#333}
  .b1{fill:#0c2d4a;stroke:#4ba3e3}.b2{fill:#0a2e2d;stroke:#3fbfba}.b3{fill:#2a1f40;stroke:#a07fd6}
  .ink{fill:#f0f0f0}.sub{fill:#bbb}.ttl{fill:#f0f0f0}.tag{fill:#f0f0f0}
 }
</style>
<rect class="fig" x="1" y="1" width="698" height="358" rx="14"/>
<text class="ttl" x="24" y="38" font-size="19">アクセス制御の3つの層</text>
<text class="sub" x="24" y="60" font-size="13">「何が」できて「どの項目／どのレコード」が見えるか、を別々に決める</text>

<rect class="b1" x="36" y="88" width="628" height="68" rx="11"/>
<text class="tag" x="60" y="118" font-size="15" font-weight="700">① オブジェクト</text>
<text class="sub" x="60" y="140" font-size="12">プロファイル / 権限セット ・ 権限セットグループ</text>
<text class="ink" x="640" y="125" font-size="12.5" text-anchor="end">作成・参照・編集・削除（CRUD）</text>
<text class="sub" x="640" y="143" font-size="11" text-anchor="end">そのオブジェクト自体を扱えるか</text>

<rect class="b2" x="36" y="168" width="628" height="68" rx="11"/>
<text class="tag" x="60" y="198" font-size="15" font-weight="700">② 項目</text>
<text class="sub" x="60" y="220" font-size="12">項目レベルセキュリティ（FLS）</text>
<text class="ink" x="640" y="205" font-size="12.5" text-anchor="end">どの項目を表示／編集できるか</text>
<text class="sub" x="640" y="223" font-size="11" text-anchor="end">見せたくない項目を隠す</text>

<rect class="b3" x="36" y="248" width="628" height="68" rx="11"/>
<text class="tag" x="60" y="278" font-size="15" font-weight="700">③ レコード</text>
<text class="sub" x="60" y="300" font-size="12">OWD ・ ロール階層 ・ 共有ルール ・ 手動共有</text>
<text class="ink" x="640" y="285" font-size="12.5" text-anchor="end">どの「行」が見えるか</text>
<text class="sub" x="640" y="303" font-size="11" text-anchor="end">誰のレコードまで見えるか</text>
</svg>
