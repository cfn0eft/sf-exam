<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" role="img" aria-label="ロール階層と可視性">
<style>
 svg{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans JP',sans-serif}
 .fig{fill:#f8fafc;stroke:#e2e8f0}
 .top{fill:#e8f3ff;stroke:#0176d3;stroke-width:1.5}
 .mid{fill:#e3eefe;stroke:#3b66d3;stroke-width:1.5}
 .leaf{fill:#eef2f7;stroke:#94a3b8;stroke-width:1.5}
 .ink{fill:#0f172a}.sub{fill:#475569}.ttl{fill:#0f172a;font-weight:700}
 .ln{stroke:#94a3b8;stroke-width:2;fill:none}.up{fill:#2e844a;font-weight:700}.no{fill:#ba0517;font-weight:700}
 @media (prefers-color-scheme:dark){
  .fig{fill:#191919;stroke:#333}
  .top{fill:#0c2d4a;stroke:#4ba3e3}.mid{fill:#142a4a;stroke:#5b86d3}.leaf{fill:#2b2b2b;stroke:#666}
  .ink{fill:#f0f0f0}.sub{fill:#bbb}.ttl{fill:#f0f0f0}.ln{stroke:#666}.up{fill:#3ba755}.no{fill:#e5404e}
 }
</style>
<defs><marker id="u" markerWidth="10" markerHeight="10" refX="5" refY="2" orient="auto"><path d="M0,8 L5,0 L10,8 Z" fill="#2e844a"/></marker></defs>
<rect class="fig" x="1" y="1" width="698" height="338" rx="14"/>
<text class="ttl" x="24" y="36" font-size="19">ロール階層と可視性</text>
<text class="sub" x="24" y="58" font-size="13">上位ロールは「下位のレコード」を閲覧できる（OWD が非公開でも）</text>

<rect class="top" x="280" y="80" width="140" height="48" rx="10"/>
<text class="ink" x="350" y="109" font-size="14" font-weight="700" text-anchor="middle">本部長</text>

<rect class="mid" x="150" y="180" width="150" height="48" rx="10"/>
<text class="ink" x="225" y="209" font-size="13.5" text-anchor="middle">営業マネージャ</text>
<rect class="mid" x="400" y="180" width="150" height="48" rx="10"/>
<text class="ink" x="475" y="209" font-size="13.5" text-anchor="middle">サポートマネージャ</text>

<rect class="leaf" x="86" y="276" width="120" height="44" rx="9"/><text class="ink" x="146" y="303" font-size="12.5" text-anchor="middle">営業担当 A</text>
<rect class="leaf" x="220" y="276" width="120" height="44" rx="9"/><text class="ink" x="280" y="303" font-size="12.5" text-anchor="middle">営業担当 B</text>
<rect class="leaf" x="430" y="276" width="140" height="44" rx="9"/><text class="ink" x="500" y="303" font-size="12.5" text-anchor="middle">サポート担当 C</text>

<line class="ln" x1="350" y1="128" x2="225" y2="180"/>
<line class="ln" x1="350" y1="128" x2="475" y2="180"/>
<line class="ln" x1="225" y1="228" x2="146" y2="276"/>
<line class="ln" x1="225" y1="228" x2="280" y2="276"/>
<line class="ln" x1="475" y1="228" x2="500" y2="276"/>

<line x1="146" y1="276" x2="210" y2="232" stroke="#2e844a" stroke-width="2.2" marker-end="url(#u)" opacity="0.9"/>
<text class="up" x="610" y="150" font-size="13" text-anchor="end">▲ 上には見える</text>
<text class="sub" x="610" y="170" font-size="11" text-anchor="end">マネージャは担当のレコードを閲覧</text>
<text class="no" x="610" y="206" font-size="13" text-anchor="end">✕ 横は見えない</text>
<text class="sub" x="610" y="226" font-size="11" text-anchor="end">営業とサポートは互いに見えない</text>
<text class="no" x="610" y="262" font-size="13" text-anchor="end">✕ 下からは見えない</text>
<text class="sub" x="610" y="282" font-size="11" text-anchor="end">担当は本部長のレコードを見られない</text>
</svg>
