# reference_url の死活チェック（週1・手動実行も可）
# 公式ヘルプのURL改編によるリンク切れを検出する。404/410 のみ失敗扱い。
name: Link Check
on:
  schedule:
    - cron: '0 21 * * 0'   # 毎週月曜 6:00 JST
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: reference_url 死活チェック
        run: node tools/check-links.js
