# 学習データとエンジンの自動検証（push / PR 毎）
# - tools/validate-data.js:    JSONスキーマ・図参照・キャッシュ版数3点セットの整合
# - tools/test-engine.js:      エンジン純粋ロジックのスモークテスト
# - tools/test-cloud-sync.js:  クラウド同期/管理者ビューの集計ロジックのスモークテスト
name: CI
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: データ整合性チェック
        run: node tools/validate-data.js
      - name: エンジン スモークテスト
        run: node tools/test-engine.js
      - name: クラウド同期 集計ロジック スモークテスト
        run: node tools/test-cloud-sync.js
      - name: 資格の利用許可と取得順のテスト
        run: node tools/test-progression.js
      - name: 問題配信の認証・照合・破棄を検証
        run: node tools/test-question-bank.js
      - name: 公開HTMLの接続設定と問題原本の除外を検証
        run: node tools/build-site.js && node tools/test-built-site.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - name: Firestoreの権限ルールを検証
        run: npx firebase emulators:exec --only firestore --project demo-sfq-bank "node tools/test-bank-rules.js"
